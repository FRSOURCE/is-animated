name: Benchmark comment
on:
  workflow_run:
    workflows:
      - Benchmark
    types:
      - completed

# Runs in the context of the default branch with a write token, so it never
# checks out or executes PR code. It only reads the results artifact and
# posts its Markdown as a sticky PR comment. This also works for fork PRs.
permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    name: post benchmark results
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download benchmark results
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: benchmark-results
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');

            const marker = '<!-- is-animated-benchmark -->';
            const run = context.payload.workflow_run;
            const dir = 'benchmark-results';
            const readIfExists = (file) => {
              const filePath = path.join(dir, file);
              return fs.existsSync(filePath) ? fs.readFileSync(filePath, 'utf8') : undefined;
            };

            // Artifact content comes from the PR, treat it as untrusted data.
            let pr;
            try {
              pr = JSON.parse(readIfExists('pr.json') ?? 'null');
            } catch {
              pr = null;
            }
            const number = Number(pr?.number);
            if (!Number.isInteger(number) || number <= 0) {
              core.notice('No PR metadata in the benchmark artifact, skipping comment.');
              return;
            }
            if (typeof pr.headSha !== 'string' || pr.headSha !== run.head_sha) {
              core.notice(`Artifact head SHA ${pr?.headSha} does not match run head SHA ${run.head_sha}, skipping comment.`);
              return;
            }

            const results = readIfExists('results.md');
            const failed = run.conclusion !== 'success';
            const status = failed
              ? `:x: ${run.conclusion}${pr.outcome === 'failure' ? ' (regression or benchmark error)' : ''}`
              : ':white_check_mark: no significant regression';
            const body = [
              marker,
              '### Benchmark: PR vs main',
              '',
              results ?? 'Benchmark did not produce results. See the workflow run log.',
              '',
              `<sub>Commit ${run.head_sha.slice(0, 7)} · ${status} · [run](${run.html_url})</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated comment ${existing.id} on PR #${number}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
              core.info(`Created comment on PR #${number}`);
            }
